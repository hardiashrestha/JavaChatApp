<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnonChat - Anonymous Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  #header { background: #1a1a2e; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #6c63ff; }
  #header h1 { font-size: 1.4rem; color: #6c63ff; letter-spacing: 1px; }
  #header h1 span { color: #ff6584; }
  #status { font-size: 0.8rem; color: #888; }
  #online-count { background: #6c63ff22; color: #6c63ff; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }
  #my-name { font-size: 0.85rem; color: #aaa; }
  #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  #chat-box::-webkit-scrollbar { width: 6px; }
  #chat-box::-webkit-scrollbar-track { background: #0f0f1a; }
  #chat-box::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; word-break: break-word; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .msg.mine { background: #6c63ff; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.theirs { background: #1e1e35; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg .sender { font-size: 0.72rem; font-weight: 600; margin-bottom: 3px; opacity: 0.8; }
  .msg.mine .sender { text-align: right; }
  .msg .time { font-size: 0.68rem; opacity: 0.5; margin-top: 4px; text-align: right; }
  .sys-msg { text-align: center; color: #555; font-size: 0.78rem; margin: 4px 0; font-style: italic; }
  #input-area { padding: 14px 20px; background: #1a1a2e; border-top: 1px solid #2a2a4a; display: flex; gap: 10px; }
  #msg-input { flex: 1; background: #0f0f1a; border: 1px solid #333; border-radius: 25px; padding: 10px 18px; color: #e0e0e0; font-size: 0.95rem; outline: none; transition: border 0.2s; }
  #msg-input:focus { border-color: #6c63ff; }
  #send-btn { background: #6c63ff; color: #fff; border: none; border-radius: 25px; padding: 10px 22px; cursor: pointer; font-size: 0.95rem; transition: background 0.2s; }
  #send-btn:hover { background: #5a52d5; }
  #connecting { display: flex; align-items: center; justify-content: center; flex: 1; flex-direction: column; gap: 12px; color: #6c63ff; }
  .dot-anim span { display: inline-block; width: 8px; height: 8px; background: #6c63ff; border-radius: 50%; margin: 0 2px; animation: bounce 1.2s infinite; }
  .dot-anim span:nth-child(2) { animation-delay: 0.2s; }
  .dot-anim span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:scale(0);} 40%{transform:scale(1);} }
</style>
</head>
<body>
<div id="header">
  <h1>Anon<span>Chat</span></h1>
  <div style="display:flex;align-items:center;gap:12px">
    <span id="my-name">Connecting...</span>
    <span id="online-count">0 online</span>
  </div>
</div>
<div id="connecting">
  <div class="dot-anim"><span></span><span></span><span></span></div>
  <p>Connecting to chat...</p>
</div>
<div id="chat-box" style="display:none"></div>
<div id="input-area" style="display:none">
  <input id="msg-input" type="text" placeholder="Type a message..." maxlength="500" />
  <button id="send-btn">Send</button>
</div>
<script>
  var myName = '';
  var ws;
  function connect() {
    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host);
    ws.onopen = function() {
      document.getElementById('connecting').style.display = 'none';
      document.getElementById('chat-box').style.display = 'flex';
      document.getElementById('input-area').style.display = 'flex';
    };
    ws.onmessage = function(e) {
      var d = JSON.parse(e.data);
      if (d.type === 'name') {
        myName = d.name;
        document.getElementById('my-name').textContent = 'You: ' + myName;
      } else if (d.type === 'message') {
        addMsg(d.name, d.text, d.name === myName);
        if (d.count !== undefined) updateCount(d.count);
      } else if (d.type === 'system') {
        addSys(d.text);
        if (d.count !== undefined) updateCount(d.count);
      }
    };
    ws.onclose = function() {
      addSys('Disconnected. Reconnecting...');
      setTimeout(connect, 3000);
    };
    ws.onerror = function() { ws.close(); };
  }
  function updateCount(n) {
    document.getElementById('online-count').textContent = n + ' online';
  }
  function now() {
    var d = new Date();
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }
  function addMsg(name, text, isMine) {
    var box = document.getElementById('chat-box');
    var div = document.createElement('div');
    div.className = 'msg ' + (isMine ? 'mine' : 'theirs');
    div.innerHTML = '<div class="sender">' + escHtml(name) + '</div><div>' + escHtml(text) + '</div><div class="time">' + now() + '</div>';
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }
  function addSys(text) {
    var box = document.getElementById('chat-box');
    var div = document.createElement('div');
    div.className = 'sys-msg';
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function sendMsg() {
    var inp = document.getElementById('msg-input');
    var txt = inp.value.trim();
    if (txt && ws && ws.readyState === 1) {
      ws.send(txt);
      inp.value = '';
    }
  }
  document.getElementById('send-btn').onclick = sendMsg;
  document.getElementById('msg-input').onkeydown = function(e) {
    if (e.key === 'Enter') sendMsg();
  };
  connect();
</script>
</body>
</html>
